services:
  ecokernel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecokernel-app
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTESERVICE_API_KEY=${OPENROUTESERVICE_API_KEY:-}
    volumes:
      - ecokernel_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  ecokernel_data:
